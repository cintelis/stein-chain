[package]
name = "stein-crypto"
description = "Stein Chain cryptographic primitives: ML-DSA and FN-DSA keys and signatures, BLAKE3 hashing, addresses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
blake3 = { workspace = true }
borsh = { workspace = true }
hex = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# FN-DSA-512 per the draft FIPS 206, signature scheme tag 3 (SPEC §3.5):
# account keys only, never validators.
# Pinned exactly, and never to be bumped in place: a different version could
# disagree about which signatures verify, which on a chain is a consensus
# split. The final standard arrives as a new scheme tag beside this one.
fn-dsa = { version = "=0.4.0" }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "sigbench"

[lints]
workspace = true
