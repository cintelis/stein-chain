<!doctype html>
<!-- The Open Graph card for steinchain.com: 1200 x 630. Not served; render.mjs
     turns it into public/og.png. Change the copy here, then re-render. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #070d1a; --line: #1e293b; --text: #f1f5f9; --soft: #94a3b8;
    --muted: #64748b; --accent: #3b82f6; --accent-soft: #60a5fa; --ok: #34d399;
    --mono: "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(19, 102, 214, .34), transparent 70%),
      radial-gradient(700px 420px at 0% 110%, rgba(19, 102, 214, .14), transparent 70%),
      var(--bg);
  }
  /* A lattice: the mathematics ML-DSA and FN-DSA rest on. */
  .lattice { position: absolute; right: -40px; top: -30px; width: 640px; height: 690px; }
  .frame { position: absolute; inset: 0; padding: 64px 72px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 56px; height: 56px; }
  .brand-name { font-size: 34px; font-weight: 600; letter-spacing: -.015em; }
  .brand-name b { color: var(--accent-soft); font-weight: 600; }
  .badge { margin-left: 18px; display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px;
    border: 1px solid rgba(30, 58, 138, .8); border-radius: 999px; background: rgba(23, 37, 84, .6);
    color: #93c5fd; font: 15px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  h1 { margin: auto 0 0; max-width: 1000px; font-family: "Inter Display", Inter, sans-serif;
    font-size: 70px; line-height: 1.06; letter-spacing: -.03em; font-weight: 700; }
  .accent { color: var(--accent-soft); white-space: nowrap; }
  .chips { margin: 44px 0 auto; display: flex; gap: 14px; }
  .chip { padding: 12px 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(15, 23, 42, .78); }
  .chip .k { color: var(--muted); font: 13px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .chip .v { margin-top: 2px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .chip .v span { color: var(--accent-soft); }
  .url { position: absolute; right: 72px; bottom: 64px; color: var(--soft); font: 22px/1 var(--mono); }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, #1366d6, #3b82f6 45%, #60a5fa 70%, rgba(96, 165, 250, 0)); }
</style>
</head>
<body>
  <svg class="lattice" viewBox="0 0 640 690" aria-hidden="true">
    <defs>
      <radialGradient id="fade" cx="62%" cy="38%" r="62%">
        <stop offset="0" stop-color="#fff" stop-opacity="1"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="m"><rect width="640" height="690" fill="url(#fade)"/></mask>
    </defs>
    <g id="pts" mask="url(#m)"></g>
  </svg>

  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#1366d6"/><path d="M10.5 20.5c1.8 1.8 4.4 2.5 7 1.8 2.5-.7 3.2-3.5.6-4.4l-4.2-1.4c-2.6-.9-2-4.4.6-4.6 1.8-.1 3.4.6 4.6 1.6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <span class="brand-name">stein<b>chain</b></span>
      <span class="badge"><span class="dot"></span>Devnet live</span>
    </div>

    <h1>The layer-1 that is<br><span class="accent">post-quantum</span> from genesis.</h1>

    <div class="chips">
      <div class="chip"><div class="k">Accounts</div><div class="v">FN-DSA-512 <span>· 790 B</span></div></div>
      <div class="chip"><div class="k">Validators</div><div class="v">ML-DSA <span>· FIPS 204</span></div></div>
      <div class="chip"><div class="k">Transport</div><div class="v">ML-KEM <span>· TLS 1.3</span></div></div>
    </div>
  </div>
  <div class="url">steinchain.com</div>
  <div class="rule"></div>

  <script>
    // A skewed 2-D lattice, with a few basis vectors drawn in.
    const g = document.getElementById('pts');
    const NS = 'http://www.w3.org/2000/svg';
    const b1 = [58, 14], b2 = [-18, 56], o = [400, 250];
    const pt = (i, j) => [o[0] + i * b1[0] + j * b2[0], o[1] + i * b1[1] + j * b2[1]];
    const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); g.appendChild(e); };
    for (let i = -10; i <= 10; i++) for (let j = -10; j <= 10; j++) {
      const [x, y] = pt(i, j);
      if (x < -20 || x > 660 || y < -20 || y > 710) continue;
      if (i < 10) { const [x2, y2] = pt(i + 1, j); el('line', { x1: x, y1: y, x2, y2, stroke: '#1e3a8a', 'stroke-width': 1, 'stroke-opacity': .45 }); }
      if (j < 10) { const [x2, y2] = pt(i, j + 1); el('line', { x1: x, y1: y, x2, y2, stroke: '#1e3a8a', 'stroke-width': 1, 'stroke-opacity': .45 }); }
    }
    for (let i = -10; i <= 10; i++) for (let j = -10; j <= 10; j++) {
      const [x, y] = pt(i, j);
      if (x < -20 || x > 660 || y < -20 || y > 710) continue;
      el('circle', { cx: x, cy: y, r: 3, fill: '#3b82f6', 'fill-opacity': .7 });
    }
    // Basis vectors from the origin, and a short vector: the hard problem.
    const [ox, oy] = pt(0, 0), [ax, ay] = pt(1, 0), [bx, by] = pt(0, 1), [cx, cy] = pt(2, 1);
    for (const [x, y, c] of [[ax, ay, '#60a5fa'], [bx, by, '#60a5fa'], [cx, cy, '#34d399']])
      el('line', { x1: ox, y1: oy, x2: x, y2: y, stroke: c, 'stroke-width': 3, 'stroke-linecap': 'round' });
    el('circle', { cx: ox, cy: oy, r: 7, fill: '#f1f5f9' });
    el('circle', { cx: cx, cy: cy, r: 6, fill: '#34d399' });
  </script>
</body>
</html>
