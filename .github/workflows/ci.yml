name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Also run the release-mode benchmarks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# As in Sigilant: third-party actions are avoided and first-party ones are
# pinned to a commit. This repository builds a blockchain; its own supply chain
# stays small.

jobs:
  identity:
    name: Contributor identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # On pull requests check the branch itself, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash scripts/check-identity.sh history

  rust:
    name: Checks, lint, tests and devnet smoke (Linux)
    runs-on: ubuntu-latest
    env:
      # Debug info is most of what a debug build writes; keep the runner's disk
      # from filling. Backtraces still get line numbers.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-text-files.sh
      - run: bash scripts/check-toolchain-pin.sh
      # Install the pinned compiler explicitly: rustup is retiring the implicit
      # install-on-first-use that a rust-toolchain.toml used to trigger.
      - run: |
          version=$(sed -nE 's/^channel *= *"(.*)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
      - run: bash scripts/check-crypto-policy.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The binaries, together, end to end: what the test suites, which drive
      # the libraries, do not cover.
      - run: cargo build --workspace --locked --bins
      - run: bash scripts/smoke-devnet.sh target/debug

  platforms:
    name: Tests (${{ matrix.os }})
    # Validators run Linux, but wallets and developers run everything. Windows
    # builds AWS-LC with its prebuilt NASM objects (.cargo/config.toml); macOS
    # builds everything from source.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version=$(sed -nE 's/^channel *= *"(.*)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --bins
      - run: bash scripts/smoke-devnet.sh target/debug

  fn-dsa:
    name: FN-DSA test network (experimental build)
    # The experimental build (SPEC §3.5): FN-DSA-512 per the draft FIPS 206,
    # compiled in only with stein-crypto's `fn-dsa-experimental` feature. The
    # standard build is checked in the jobs above and must not contain it.
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      FEATURES: stein-crypto/fn-dsa-experimental
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version=$(sed -nE 's/^channel *= *"(.*)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal --component clippy
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
      - run: cargo test --workspace --locked --features "$FEATURES"
      - run: cargo build --workspace --locked --bins --features "$FEATURES"
      - run: bash scripts/smoke-fn-dsa.sh target/debug

  advisories:
    name: Dependency advisories (RustSec)
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}
      - run: |
          version=$(sed -nE 's/^channel *= *"(.*)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
      - if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      # Fails on any known vulnerability in a locked dependency.
      - run: cargo audit

  benchmarks:
    name: Benchmarks (release, informational)
    # Shared CI runners are noisy, so this never gates a merge. Run it by hand
    # (Actions → CI → Run workflow → benchmarks) to compare against SPEC §2.
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version=$(sed -nE 's/^channel *= *"(.*)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
      - run: cargo run --release --locked -p stein-crypto --example sigbench | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo run --release --locked -p stein-state --example throughput | tee -a "$GITHUB_STEP_SUMMARY"
