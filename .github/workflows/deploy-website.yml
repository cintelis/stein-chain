name: Deploy steinchain.com

# The home page is static files and one small Worker (the message inbox):
# deploy whenever they change on main, or by hand (Actions → Deploy
# steinchain.com → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE: https://steinchain.com
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --check public/app.js
      # wrangler is pinned in package-lock.json; no third-party deploy action.
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # The deploy token has no D1 rights, on purpose: this workflow can
      # neither read nor delete the inbox. A new migration is applied by hand
      # before the push that needs it (website/README.md).
      # Builds public/message.js (wrangler.jsonc, "build"), then deploys.
      - run: npx wrangler deploy
      # What is served must be what was committed and built, with the security
      # headers, and the API must behave. A query string unique to this run
      # bypasses Cloudflare's edge cache. A new version rolls out gradually,
      # so back-to-back requests can be answered by different versions: every
      # check must pass three rounds in a row.
      - name: Verify the deployment
        run: |
          q="?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          same() { curl -fsS "$SITE/$1$q" | cmp -s - "$2" || { why="served $1 is not the built one"; return 1; }; }
          answers() { # path, expected status, then curl arguments for the body
            local path=$1 want=$2 code; shift 2
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "origin: $SITE" "$@" "$SITE$path")
            [ "$code" = "$want" ] || { why="POST $path answered $code, expected $want"; return 1; }
          }
          json=(-H 'content-type: application/json')
          check() {
            same app.js public/app.js && same message.js public/message.js && same inbox.js public/inbox.js &&
              same stein_wallet_core.wasm vendor/stein-wallet-core/stein_wallet_core.wasm || return 1
            headers=$(curl -fsSI "$SITE/") || { why="the page did not answer"; return 1; }
            grep -qi "^content-security-policy: default-src 'self'" <<<"$headers" &&
              grep -qi "^x-content-type-options: nosniff" <<<"$headers" || { why="security headers missing"; return 1; }
            # The inbox refuses what is not a sealed message (nothing is stored)
            # and stays shut to a caller without its key, and registration
            # refuses what is not a key and a signature. All three are refused
            # before any rate limit, so repeating them costs nothing.
            answers /api/message 400 --data-binary 'not sealed' &&
              answers /api/inbox/open 403 "${json[@]}" --data '{"id":"none","proof":"none"}' &&
              answers /api/register 400 "${json[@]}" --data '{"public_key":"AA","signature":"AA"}'
          }
          streak=0
          why="not checked"
          for _ in $(seq 90); do
            if check; then streak=$((streak + 1)); else streak=0; fi
            [ "$streak" -ge 3 ] && exit 0
            sleep 5
          done
          echo "the deployment did not settle within 7.5 minutes: $why" >&2
          exit 1
