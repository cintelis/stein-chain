name: Deploy Cloudflare follower

# Deploys the devnet follower (deploy/cloudflare) to Cloudflare Containers.
#
# Automatically: after CI succeeds on main, deploying exactly the commit CI
# tested, and only if node or deployment code changed since the last
# successful deploy (an image build plus Cloudflare's rollout takes minutes).
# By hand: Actions → Deploy Cloudflare follower → Run workflow, optionally
# overriding the leader URL and genesis hash.
#
# The leader and the genesis hash to pin come from repository variables
# STEIN_LEADER_URL and STEIN_GENESIS_HASH, set by the validator's operator.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      leader_url:
        description: Validator RPC URL (blank = repository variable STEIN_LEADER_URL)
        required: false
        type: string
      genesis_hash:
        description: Genesis hash to pin (blank = repository variable STEIN_GENESIS_HASH)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-follower
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy follower
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      # Inputs reach scripts as environment variables, never spliced into
      # shell commands, so they cannot inject commands.
      LEADER_URL: ${{ inputs.leader_url || vars.STEIN_LEADER_URL }}
      STEIN_GENESIS_HASH: ${{ inputs.genesis_hash || vars.STEIN_GENESIS_HASH }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      FOLLOWER: https://stein-follower.nick-598.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Did node or deployment code change since the last deploy?
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list --workflow deploy-follower.yml --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "no previous deploy to compare with: deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$last" "$HEAD_SHA" -- \
            crates Cargo.toml Cargo.lock rust-toolchain.toml deploy/docker deploy/cloudflare)
          if [ -n "$changed" ]; then
            echo "changed since $last:"; echo "$changed"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the follower runs changed since $last: skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: deploy/cloudflare
      # wrangler builds deploy/docker/Dockerfile (from source, pinned
      # compiler) with the runner's Docker and pushes it to Cloudflare.
      # deploy.sh refuses a leader that is not on the pinned genesis.
      - if: steps.changes.outputs.deploy == 'true'
        run: bash deploy/cloudflare/deploy.sh "$LEADER_URL"
      - if: steps.changes.outputs.deploy == 'true'
        name: Report
        run: |
          echo "Deployed $HEAD_SHA. Cloudflare rolls a new image out to the running"
          echo "instance over several minutes; until then $FOLLOWER may serve the previous one."
          curl -fsS "$FOLLOWER/status" || true
